services:
  - type: web
    name: tag-stickmen
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_USERNAME
        value: 시후
      - key: ADMIN_PASSWORD
        sync: false
